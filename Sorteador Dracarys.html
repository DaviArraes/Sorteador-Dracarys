<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorteador Dracarys</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--red:#a30808;--red-hi:#d41a1a;--bg:#000;--panel:#120606;--line:#3a0f0f;--text:#f3e9e9;--mute:#a58a8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5;
background-image:radial-gradient(ellipse at 50% -10%,#3a0505 0,transparent 60%)}
h1,h2,.num{font-family:Oswald,Impact,"Arial Narrow",sans-serif;margin:0}
main{max-width:1080px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
header img{width:72px;height:auto}
h1{font-size:clamp(1.6rem,5vw,2.4rem);letter-spacing:.02em;line-height:1.1}
header p{margin:2px 0 0;color:var(--mute)}
.stage{background:var(--panel);border:2px solid var(--red);border-radius:6px;padding:28px 16px;text-align:center;
box-shadow:0 0 40px rgba(163,8,8,.35)}
.num{font-size:clamp(5rem,26vw,12rem);line-height:1;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.stage.spin .num{color:var(--red-hi)}
.stage.won .num{color:#fff;text-shadow:0 0 30px var(--red-hi);animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.name{min-height:2.2em;font-size:clamp(1.1rem,4vw,1.6rem);font-weight:600;margin:6px 0 18px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-weight:600;border-radius:4px;padding:14px 28px;cursor:pointer;border:2px solid var(--red)}
#go{background:var(--red);color:#fff;font-size:1.2rem;min-width:200px}
#go:hover:not(:disabled){background:var(--red-hi)}
#reset{background:transparent;color:var(--text)}
#reset:hover{background:#2a0a0a}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cols{display:grid;grid-template-columns:1fr;gap:24px;margin-top:28px}
@media(min-width:820px){.cols{grid-template-columns:300px 1fr}}
h2{font-size:1.3rem;margin-bottom:10px;letter-spacing:.03em}
ol{list-style:none;margin:0;padding:0}
ol li{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-left:4px solid var(--red);background:var(--panel);margin-bottom:8px}
ol li b{font-family:Oswald,sans-serif;font-size:1.3rem;color:var(--red-hi)}
.empty{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:3px;max-height:420px;overflow-y:auto;padding:4px 4px 4px 0}
.grid span{font-size:.72rem;text-align:center;padding:5px 0;background:#150808;color:var(--mute);border-radius:2px}
.grid span.d{background:var(--red);color:#fff;font-weight:700}
.foot{margin-top:28px;color:var(--mute);font-size:.85rem;text-align:center}
@media(prefers-reduced-motion:reduce){.stage.won .num{animation:none}}
</style>
</head>

<div><h1>Sorteador Dracarys</h1><p>700 números · clique em sortear</p></div>
</header>

<section class="stage" id="stage" aria-live="polite">
<div class="num" id="num">?</div>
<div class="name" id="name">Pronto para o primeiro sorteio</div>
<div class="btns">
<button id="go">Sortear</button>
<button id="reset">Reiniciar</button>
</div>
</section>

<div class="cols">
<section>
<h2>Sorteados</h2>
<ol id="hist"><li class="empty">Nenhum número sorteado ainda.</li></ol>
</section>
<section>
<h2>Todos os números</h2>
<div class="grid" id="grid"></div>
</section>
</div>
<p class="foot">Equipe de Robótica Dracarys</p>
</main>
<script>
const TOTAL = 700;
// Ordem fixa dos primeiros sorteios (número -> nome). Depois deles, o sorteio segue aleatório.
const FIXOS = [
  {n:684, nome:"Josimar Ferreira Carvalho"},
  {n:326, nome:"Adson Castro Arraes"}
];
let drawn = [], busy = false;
const $ = id => document.getElementById(id);
const grid = $("grid");
for(let i=1;i<=TOTAL;i++){const s=document.createElement("span");s.id="n"+i;s.textContent=i;grid.appendChild(s);}

function pick(){
  const idx = drawn.length;
  if(idx < FIXOS.length) return FIXOS[idx];
  const left=[];
  for(let i=1;i<=TOTAL;i++) if(!drawn.some(d=>d.n===i)) left.push(i);
  if(!left.length) return null;
  const n = left[Math.floor(Math.random()*left.length)];
  return {n, nome:"Participante nº "+n};
}
function render(){
  const h=$("hist");
  h.innerHTML = drawn.length ? "" : '<li class="empty">Nenhum número sorteado ainda.</li>';
  drawn.forEach((d,i)=>{
    const li=document.createElement("li");
    li.innerHTML=`<span>${i+1}º · ${d.nome}</span><b>${d.n}</b>`;
    h.appendChild(li);
  });
  document.querySelectorAll(".grid .d").forEach(e=>e.classList.remove("d"));
  drawn.forEach(d=>$("n"+d.n).classList.add("d"));
}
function sortear(){
  if(busy) return;
  const r = pick();
  if(!r){ $("name").textContent="Todos os números já foram sorteados."; return; }
  busy=true; $("go").disabled=true;
  const st=$("stage"); st.classList.remove("won"); st.classList.add("spin");
  $("name").textContent="Sorteando...";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t=0; const total = reduce?1:34;
  (function tick(){
    t++;
    if(t<total){
      $("num").textContent = 1+Math.floor(Math.random()*TOTAL);
      setTimeout(tick, 50 + t*t*0.12);
    } else {
      $("num").textContent = r.n;
      $("name").textContent = r.nome;
      st.classList.remove("spin"); st.classList.add("won");
      drawn.push(r); render();
      busy=false; $("go").disabled=false;
    }
  })();
}
$("go").onclick=sortear;
$("reset").onclick=()=>{ if(busy) return; drawn=[]; $("num").textContent="?"; $("name").textContent="Pronto para o primeiro sorteio"; $("stage").classList.remove("won"); render(); };
</script>
